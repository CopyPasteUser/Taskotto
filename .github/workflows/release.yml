name: Linux release

on:
  push:
    tags: ['v1.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "taskotto") | .version')
          test "v${version}" = "$GITHUB_REF_NAME"
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Create portable archive
        run: |
          mkdir -p dist/taskotto
          install -Dm755 target/release/taskotto dist/taskotto/taskotto
          install -Dm644 packaging/io.github.copypasteuser.taskotto.desktop dist/taskotto/io.github.copypasteuser.taskotto.desktop
          install -Dm644 assets/io.github.copypasteuser.taskotto.svg dist/taskotto/io.github.copypasteuser.taskotto.svg
          install -Dm644 README.md LICENSE QA.md RELEASE_NOTES.md dist/taskotto/
          tar -C dist -czf "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" taskotto
          sha256sum "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > "taskotto-${GITHUB_REF_NAME}-SHA256SUMS.txt"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "taskotto-${GITHUB_REF_NAME}-SHA256SUMS.txt" \
            --verify-tag --generate-notes "${flags[@]}"
