name: Linux release

on:
  push:
    tags: ['v1.*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify tag matches Cargo version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "taskotto") | .version')
          test "v${version}" = "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Create portable archive
        run: |
          mkdir -p dist/taskotto
          install -Dm755 target/release/taskotto dist/taskotto/taskotto
          install -Dm644 packaging/io.github.copypasteuser.taskotto.desktop dist/taskotto/io.github.copypasteuser.taskotto.desktop
          install -Dm644 assets/io.github.copypasteuser.taskotto.svg dist/taskotto/io.github.copypasteuser.taskotto.svg
          install -Dm644 README.md LICENSE QA.md RELEASE_NOTES.md CHANGELOG.md SECURITY.md dist/taskotto/
          # Stable ordering, ownership and timestamps for repeatable archive metadata.
          source_date_epoch=$(git log -1 --format=%ct)
          tar --sort=name --mtime="@${source_date_epoch}" \
            --owner=0 --group=0 --numeric-owner -C dist -cf - taskotto \
            | gzip -n > "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz"
          sha256sum "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" > "taskotto-${GITHUB_REF_NAME}-SHA256SUMS.txt"
      - name: Smoke-test release archive and user-local installation
        run: |
          sha256sum -c "taskotto-${GITHUB_REF_NAME}-SHA256SUMS.txt"
          test_dir=$(mktemp -d)
          tar -xzf "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C "$test_dir"
          "$test_dir/taskotto/taskotto" --version | grep -Fx "Taskotto ${GITHUB_REF_NAME#v}"
          "$test_dir/taskotto/taskotto" --snapshot --json | jq -e '.logical_cpus > 0 and .memory.total > 0'
          XDG_DATA_HOME="$test_dir/user-data" "$test_dir/taskotto/taskotto" --install-desktop
          test -s "$test_dir/user-data/applications/io.github.copypasteuser.taskotto.desktop"
          test -s "$test_dir/user-data/icons/hicolor/scalable/apps/io.github.copypasteuser.taskotto.svg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "taskotto-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "taskotto-${GITHUB_REF_NAME}-SHA256SUMS.txt" \
            --verify-tag --generate-notes "${flags[@]}"
