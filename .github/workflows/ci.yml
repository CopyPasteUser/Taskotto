name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Smoke-test bundled installer, launcher and icon
        run: |
          test_dir=$(mktemp -d)
          cp install.sh target/release/taskotto "$test_dir/"
          HOME="$test_dir/home" CARGO_HOME="$test_dir/home/.cargo" XDG_DATA_HOME="$test_dir/user-data" bash "$test_dir/install.sh"
          test -x "$test_dir/home/.cargo/bin/taskotto"
          test -s "$test_dir/user-data/applications/io.github.copypasteuser.taskotto.desktop"
          test -s "$test_dir/user-data/icons/hicolor/scalable/apps/io.github.copypasteuser.taskotto.svg"
          test -s "$test_dir/user-data/icons/hicolor/256x256/apps/io.github.copypasteuser.taskotto.png"
          grep -Fq "$test_dir/home/.cargo/bin/taskotto" "$test_dir/user-data/applications/io.github.copypasteuser.taskotto.desktop"
          grep -Fqx "Icon=$test_dir/user-data/icons/hicolor/256x256/apps/io.github.copypasteuser.taskotto.png" "$test_dir/user-data/applications/io.github.copypasteuser.taskotto.desktop"
      - run: ./target/release/taskotto --snapshot
      - run: ./target/release/taskotto --snapshot --json | jq -e '.logical_cpus > 0 and .memory.total > 0'
      - name: Smoke-test read-only Linux GUI memory benchmark
        run: |
          sleep 5 &
          target=$!
          trap 'kill "$target" 2>/dev/null || true' EXIT
          bash -n scripts/benchmark-gui-memory.sh
          result=$(bash scripts/benchmark-gui-memory.sh --pid "$target" --seconds 1)
          printf '%s\n' "$result" | grep -F 'RSS (MiB):'
          printf '%s\n' "$result" | grep -F 'CPU:'
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo check --locked --all-targets
